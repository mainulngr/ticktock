  - Added Chrome impersonation to all public download requests.
  - Pinned `YT_DLP_PATH` to the project virtualenv and resolved it absolutely for channel-directory execution.
  - Requeued all 648 unresolved videos and restarted the scheduler.
  - Verified the live yt-dlp child uses the virtualenv executable and `--impersonate chrome`.
