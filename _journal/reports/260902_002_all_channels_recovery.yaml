intent: "Apply TikTok download workarounds to all channels and build them into the scheduler as graceful, automatic retries."
actions_taken:
  - Added ticktock/recovery.py with a fallback chain: browser cookies + UA, cookies.txt, TikTok embed pages.
  - Extended ticktock/yt_dlp.py to support per-call extra_base_args and output_template.
  - Integrated Recovery into ticktock/downloader.py so every watch/run cycle retries failures.
