  - Verified one video downloads successfully for the new channel.
  - Restarted the scheduler so it picks up the new channel (PID 1115396 / 1115399).
  - Added `.env` config for `TIKTOK_COOKIES_FROM_BROWSER` and yt-dlp sleep options.
  - Passed the new options through to `yt-dlp` in `ticktock/yt_dlp.py`.
  - Documented the options in `.env.example` and `workspace.md`.
files_modified:
  - settings.toml
