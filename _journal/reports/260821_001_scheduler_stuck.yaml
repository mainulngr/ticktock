intent: "Diagnose and fix scheduler stuck repeatedly checking englishfuns with zero downloads"
actions_taken:
  - Inspected scheduler.log and found infinite loop: scheduler stayed focused on englishfuns every 120s, but downloader always reported "no pending videos".
  - Ran `just status` to confirm many channels had pending videos (phanith_small 429, dhdud3516 365, etc.) while englishfuns only had 11.
  - Compared list cache and state DB: englishfuns cache had 661 videos, state DB had 672 total; 11 pending videos in DB were absent from the cache/yt-dlp listing.
  - Invalidated the stale englishfuns list cache; yt-dlp re-listed and again returned only 661 videos, confirming the 11 DB entries are no longer visible to yt-dlp.
  - Fixed scheduler sticky-focus logic in ticktock/scheduler.py so a channel releases focus when it makes zero downloads, preventing a single stuck channel from blocking all others.
  - Committed the fix and restarted the scheduler; it immediately moved on to phanith_small and began downloading.
files_modified:
  - ticktock/scheduler.py
  - data/list_cache/englishfuns.json (deleted/invalidated, regenerated by scheduler)
  - _journal/reports/260821_001_scheduler_stuck.yaml
notes: >
  The 11 englishfuns videos remain pending in the DB because they no longer appear in yt-dlp listings.
  With the scheduler fix they will no longer block other channels, but they will be re-checked each time the scheduler cycles back to englishfuns.
  If they are permanently gone, consider marking them failed or removing them from state.db.
